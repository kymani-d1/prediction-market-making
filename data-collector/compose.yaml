name: prediction-market-data

x-collector-base: &collector-base
  image: ${COLLECTOR_IMAGE:-prediction-market-collector:local}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment: &collector-environment
    # Use separate fields locally so passwords containing URL-reserved
    # characters are encoded by the application instead of Compose.
    DATABASE_URL: ""
    POSTGRES_HOST: database
    POSTGRES_PORT: "5432"
  depends_on:
    database:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  init: true
  restart: unless-stopped
  stop_grace_period: 45s
  healthcheck:
    test: ["CMD", "python", "-m", "prediction_collector", "status"]
    interval: 30s
    timeout: 15s
    retries: 3
    start_period: 30s

services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prediction_collector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prediction_collector}
      POSTGRES_DB: ${POSTGRES_DB:-prediction_markets}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ expects the volume at /var/lib/postgresql so major-version
      # upgrades can use version-specific data directories beneath it.
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    image: ${COLLECTOR_IMAGE:-prediction-market-collector:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *collector-environment
    command: ["migrate"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  # Full production collector. The host key is mounted read-only and is never
  # copied into the image. Use only a newly rotated Kalshi key.
  collector:
    <<: *collector-base
    profiles: ["authenticated"]
    # Match the Linux owner of the mode-0600 host key. Docker Desktop on
    # Windows maps host ACLs into its VM and can normally use these defaults.
    user: "${COLLECTOR_UID:-1000}:${COLLECTOR_GID:-1000}"
    environment:
      <<: *collector-environment
      KALSHI_PRIVATE_KEY_PATH: /run/collector-secrets/kalshi-private-key.pem
    volumes:
      - type: bind
        source: ${KALSHI_PRIVATE_KEY_HOST_PATH:-./secrets/kalshi-private-key.pem}
        target: /run/collector-secrets/kalshi-private-key.pem
        read_only: true
        bind:
          create_host_path: false
    command: ["run", "--exchange", "all"]

  # Key-free fallback: Polymarket live feeds and both exchanges' public REST
  # remain available, but authenticated Kalshi market/lifecycle/reference
  # WebSockets are intentionally disabled.
  collector-public:
    <<: *collector-base
    profiles: ["public"]
    environment:
      <<: *collector-environment
      KALSHI_API_KEY_ID: ""
      KALSHI_PRIVATE_KEY_PATH: ""
    command: ["run", "--exchange", "all"]

volumes:
  postgres_data:
