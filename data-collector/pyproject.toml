[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-collector"
version = "0.1.0"
description = "Read-only Polymarket and Kalshi research data collector"
requires-python = ">=3.14"
dependencies = [
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2.6,<4",
  "python-dotenv>=1.1,<2",
  "websockets>=15,<17",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

