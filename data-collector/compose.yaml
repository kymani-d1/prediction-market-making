name: prediction-market-data

x-collector-base: &collector-base
  image: ${COLLECTOR_IMAGE:-prediction-market-collector:local}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment: &collector-environment
    DATABASE_URL: ""
    POSTGRES_HOST: database
    POSTGRES_PORT: "5432"
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://object-store:9000}
    S3_BUCKET: ${S3_BUCKET:-prediction-market-archive}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local-archive-admin}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-this-local-archive-password}
    S3_URL_STYLE: ${S3_URL_STYLE:-path}
  depends_on:
    database:
      condition: service_healthy
    object-store-init:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully
  init: true
  stop_grace_period: 60s

services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prediction_collector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prediction_collector}
      POSTGRES_DB: ${POSTGRES_DB:-prediction_markets}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  object-store:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-archive-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-local-archive-password}
    ports:
      - "${MINIO_BIND_HOST:-127.0.0.1}:9000:9000"
      - "${MINIO_BIND_HOST:-127.0.0.1}:9001:9001"
    volumes:
      - object_store_data:/data
    restart: unless-stopped

  object-store-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - object-store
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://object-store:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-archive-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-local-archive-password}
      S3_BUCKET: ${S3_BUCKET:-prediction-market-archive}
    restart: "no"

  migrate:
    image: ${COLLECTOR_IMAGE:-prediction-market-collector:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *collector-environment
    command: ["migrate"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  collector:
    <<: *collector-base
    command: ["run"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "prediction_collector", "status"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 300s

volumes:
  postgres_data:
  object_store_data:
